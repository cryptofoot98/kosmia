[build]
  publish = "public"
  command = "sh scripts/build-config.sh"

# astronomy-engine is loaded with require() in the functions, so its CommonJS build ships alongside them.
[functions]
  included_files = ["node_modules/astronomy-engine/astronomy.js", "node_modules/astronomy-engine/package.json"]

# Earlier addresses (the first release's single words, then the six sections) move permanently to their places among
# the five destinations: Home, Horoscope, Tarot, Discover and Kassandra. The app also maps any it is opened on.
[[redirects]]
  from = "/fortune"
  to = "/tarot/whisper"
  status = 301

