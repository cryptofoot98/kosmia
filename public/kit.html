<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Kosmia kit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Source+Sans+3:wght@400;600&display=swap">
<link rel="stylesheet" href="/styles.css">
<script src="/art/sizes.js"></script>
<script src="/kit.js"></script>
<style>
 /* the gallery's own furniture */
 .g{display:flex;flex-direction:column;gap:22px;padding:18px 16px 40px}
 .g>h1{text-align:center;font-family:var(--font-display);letter-spacing:.08em}
 .g h2.gh{font-family:var(--font-display);font-size:var(--fs-sm);letter-spacing:var(--ls-caps);text-transform:uppercase;color:var(--k-gold-deep);margin:10px 0 -10px}
 .sw{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
 .sw div{display:flex;flex-direction:column;gap:4px;font:12px/1.3 var(--font-read);color:var(--k-ink-soft)}
 .sw i{height:44px;border-radius:var(--r-sm);border:1px solid rgba(var(--k-gold-rgb),.5)}
 .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
 .demo-scene .ks-content{padding:22px 16px 26px;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
 .demo-scene .card{width:62%;color:var(--k-ink)}
 #nav.demo{position:static;pointer-events:auto}
</style>
</head>
<body>
<main id="app"><div class="g" id="g"></div></main>
<script>
const K=Kit,$g=document.getElementById('g');
const sw=[['--k-midnight','Midnight navy'],['--k-celestial','Celestial blue'],['--k-celestial-2','Night sky'],['--k-gold','Antique gold'],['--k-gold-light','Light gold'],['--k-gold-deep','Deep gold'],
 ['--k-parchment','Parchment'],['--k-parchment-light','Light parchment'],['--k-ivory','Ivory'],['--k-ink','Ink brown'],['--k-ink-soft','Soft ink'],['--k-ink-muted','Muted ink'],
 ['--k-burgundy','Burgundy'],['--k-rose','Rose'],['--k-green','Botanical green']];
const cs=getComputedStyle(document.documentElement);
$g.innerHTML=`<h1>Kosmia kit</h1>
<p class="lead">Every piece the screens are built from, drawn from <code>kit.js</code> and the tokens at the top of <code>styles.css</code>.</p>
<h2 class="gh">Palette tokens</h2>
<div class="sw">${sw.map(([v,n])=>`<div><i style="background:var(${v})"></i>${n}<br>${cs.getPropertyValue(v).trim()}</div>`).join('')}</div>
<h2 class="gh">Type</h2>
${K.panel(`<p class="cz" style="font-size:var(--fs-xl)">Kosmia</p><h2>Cormorant Garamond, the editorial serif</h2><p class="keys">Harmony <i class="dot">•</i> Beauty <i class="dot">•</i> Balance</p><div class="read"><p>Source Sans 3 carries the long readings, set at a comfortable measure and line height for reading on a phone.</p></div><p class="quote">“A period of healing and clarity is unfolding.”</p>`)}
<h2 class="gh">CelestialScene · ForegroundIllustration</h2>
${K.scene({cls:'demo-scene',bg:'atlas/landscape',parallax:false,veil:true,stars:true,label:'Scene demo',
 fg:[{path:'atlas/ico-love',w:'30%',left:'4%',bottom:'6%'},{path:'atlas/ico-health',w:'22%',left:'30%',top:'8%',layer:'under'}],
 content:K.panel(`<h3>Content layer</h3><p>Real, interactive HTML on parchment. The heart is foreground art over this panel; the leaf sits under it.</p>${K.pill('Read more',{size:'sm',arrow:true})}`,{frame:'ornate'})})}
<h2 class="gh">ParchmentPanel</h2>
${K.panel('<h3>Plain</h3><p>A gold-ruled parchment panel.</p>')}
${K.panel(`${K.heading('Ornate')}<p>Flourishes at two corners.</p>`,{frame:'ornate'})}
${K.panel(`${K.heading('Gilt')}<p>Inner gold rule and flourishes at all four corners.</p>`,{frame:'gilt'})}
<h2 class="gh">IllustratedSectionHeader · CelestialDivider</h2>
${K.heading('Upcoming Celestial Events','<button class="see">See all</button>')}
${K.divider()}${K.divider('Your zodiac signs')}
<h2 class="gh">OrnamentalFrame</h2>
<div class="row" style="align-items:flex-start">
 <span style="width:30%">${K.frame(K.img('atlas/plate-libra'),{shape:'arch'})}</span>
 <span style="width:30%">${K.frame(K.img('atlas/med-libra'),{shape:'circle'})}</span>
 <span style="width:30%">${K.frame(K.img('atlas/ev-full'),{corners:true})}</span>
</div>
<h2 class="gh">TarotCardDisplay</h2>
<div class="row"><span style="width:40%">${K.tarot({art:'deck/m17',num:'XVII',name:'The Star',alt:'The Star'})}</span><span style="width:28%">${K.tarot({art:'deck/m0',num:'0',name:'The Fool'})}</span></div>
<h2 class="gh">CosmicEventCard</h2>
<div class="evgrid">${K.event({art:K.img('atlas/ev-eclipse'),title:'Partial Lunar Eclipse<br>in Taurus',date:'28 Oct 2026',note:'Transformation'})}${K.event({art:K.img('atlas/ev-planet'),title:'Mercury Direct',date:'11 Nov 2026',note:'Clearer communication'})}${K.event({art:K.img('atlas/ev-full'),title:'Full Moon<br>in Taurus',date:'5 Nov 2026',note:'Grounding and abundance'})}</div>
<h2 class="gh">IllustratedFeatureCard</h2>
<div class="dgrid">${K.feature({art:'atlas/ex-chart',ar:'4/3',title:'Birth Chart',sub:'Your cosmic blueprint'})}${K.feature({art:'atlas/ex-compat',ar:'4/3',title:'Zodiac Affinity',sub:'Compatibility'})}${K.feature({art:'atlas/banner-calendar',title:'Cosmic Calendar',sub:'Celestial events',dark:true})}${K.feature({art:'atlas/banner-library',title:'Astrology Library',sub:'Learn & explore',dark:true})}</div>
<h2 class="gh">EngravedIcon</h2>
<div class="row">${['sun','moon','tarot','compass','kassandra','star','arrow'].map(n=>K.icon(n,{label:n})).join('')}</div>
<h2 class="gh">AntiquePillButton</h2>
<div class="row">${K.pill('Read Full Horoscope',{arrow:true})}${K.pill('Dream Library',{variant:'ghost'})}${K.pill('Small',{size:'sm'})}</div>
<div class="row" style="background:var(--k-midnight);padding:12px;border-radius:var(--r-md)">${K.pill('Begin Your Journey',{variant:'gold',arrow:true})}${K.pill('Start a conversation',{variant:'light',size:'sm',arrow:true})}</div>
<h2 class="gh">KosmiaBottomNavigation</h2>
<nav id="nav" class="demo" aria-label="Demo menu"><div class="in">${K.nav([['home','Home'],['horoscope','Horoscope'],['tarot','Tarot'],['discover','Discover'],['kassandra','Kassandra']].map(([key,label])=>({key,label})),'home')}</div></nav>`;
</script>
</body>
</html>
